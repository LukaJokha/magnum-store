<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
  <title>MAGNUM — პაროლის აღდგენა</title>
  <script src="reset-password.js"></script>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="password-security.css">
</head>
<body class="admin-body">
  <main class="admin-main"><section class="admin-card">
    <p class="eyebrow">ადმინისტრირება</p><h1>პაროლის აღდგენა</h1>
    <p id="recoveryStatus" role="status">აღდგენის ბმული მოწმდება…</p>
    <form id="recoveryForm" hidden>
      <label>ახალი პაროლი<input name="password" type="password" autocomplete="new-password" minlength="16" maxlength="128" required></label>
      <label>გაიმეორეთ პაროლი<input name="confirmation" type="password" autocomplete="new-password" minlength="16" maxlength="128" required></label>
      <p>გამოიყენეთ 16–128 სიმბოლო: ასო, ციფრი და სპეციალური სიმბოლო.</p>
      <button class="primary" id="recoverButton">ახალი პაროლის შენახვა</button>
    </form>
    <p><a href="admin.html">ადმინისტრირებაში შესვლა / ახალი ბმულის მოთხოვნა</a></p>
  </section></main>
  <script src="supabase.js" data-recovery></script>
</body></html>
