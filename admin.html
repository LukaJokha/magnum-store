<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MAGNUM — ადმინისტრირება</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
  <header class="admin-header"><a class="logo" href="index.html"><span class="logo-mark">M</span><span>MAGNUM</span></a><a href="products.html">კატალოგის ნახვა</a></header>
  <main class="admin-main">
    <section class="admin-card" id="loginPanel">
      <p class="eyebrow">ადმინისტრირება</p><h1>შესვლა</h1><p>შეიყვანეთ Supabase Authentication-ში შექმნილი ადმინისტრატორის ელფოსტა და პაროლი.</p>
      <form id="loginForm"><label>ელფოსტა<input name="email" type="email" autocomplete="email" required></label><label>პაროლი<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">შესვლა</button><p class="form-message" id="loginMessage"></p></form>
    </section>
    <section class="admin-card" id="productPanel" hidden>
      <div class="admin-title"><div><p class="eyebrow">ადმინისტრირება</p><h1>ახალი პროდუქტი</h1></div><div><a class="text-button" href="manage-products.html">პროდუქტების მართვა</a> <button id="logout" class="text-button">გასვლა</button></div></div>
      <p>პროდუქტი და მისი სურათი შეინახება ონლაინ ბაზაში და მაშინვე გამოჩნდება Vercel კატალოგში.</p>
      <button class="text-button" id="importButton">არსებული კატალოგის იმპორტი</button><p class="form-message" id="importMessage"></p>
      <form id="productForm">
        <div class="two-cols"><label>პროდუქტის დასახელება<input name="name" required maxlength="220" placeholder="მაგ: HUGLU VEYRON Synthetic"></label><label>ფასი, ₾<input name="amount" type="number" min="0" step="1" required placeholder="1700"></label></div>
        <div class="two-cols"><label>კატეგორია<select name="category" required><option value="">აირჩიეთ კატეგორია</option><option>ცეცხლსასროლი იარაღი</option><option>პნევმატიკა</option><option>დანები</option><option>აქსესუარები</option><option>ოპტიკა</option><option>ფანრები</option><option>ნავები და ძრავები</option><option>ტურიზმი</option></select></label><label>ბრენდი<select name="brand"><option value="">არ არის მითითებული</option></select></label></div>
        <div class="two-cols"><label>კალიბრი<select name="caliber"><option value="">არ არის მითითებული</option></select></label><label>ლულის სიგრძე<select name="barrelLength"><option value="">არ არის მითითებული</option></select></label></div>
        <label>აღწერა <span class="optional">(არასავალდებულო)</span><textarea name="description" rows="5" maxlength="1200" placeholder="მახასიათებლები, კომპლექტაცია ან მოკლე აღწერა"></textarea></label>
        <label>პროდუქტის სურათი<input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required><span class="file-note">JPG, PNG, WEBP ან GIF, მაქს. 5 MB</span></label><div class="preview" id="preview" hidden><img alt="სურათის წინასწარი ნახვა"></div>
        <button class="primary" id="saveButton">პროდუქტის დამატება</button><p class="form-message" id="productMessage"></p>
      </form>
    </section>
  </main>
  <script src="supabase.js"></script><script src="admin.js"></script>
</body></html>
